<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Baja Cajero</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="baja_cajero.css" />
  <script defer src="../js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <!-- Drawer -->
  <div class="drawer" id="drawer">
    <img src="../assets/logoBlanco.png" alt="Logo Arygatos" class="logo" />
    <div class="menu-option"><i class="fas fa-box-open"></i><span>Alta de producto</span></div>
    <div class="menu-option"><i class="fas fa-edit"></i><span>Modificación de producto</span></div>
    <div class="menu-option"><i class="fas fa-users-cog"></i><span>Gestión de cajeros</span></div>
    <div class="menu-option"><i class="fas fa-user-slash"></i><span>Baneo de clientes</span></div>
    <div class="menu-option"><i class="fas fa-cogs"></i><span>Variables del sistema</span></div>
    <div class="menu-option"><i class="fas fa-chart-line"></i><span>Acceso de reportes</span></div>
    <button class="logout-button">Cerrar sesión</button>
  </div>

  <main class="container">
    <header class="header">
      <button id="menuToggle" class="menu-btn"><i class="fas fa-bars"></i></button>
      <h1>Gestión de cajeros - baja</h1>
      <img src="../assets/logo.png" alt="Logo Arygatos" class="logo-header" />
    </header>

    <section class="form-card">
      <div class="input-group">
        <label>Número de cajero:</label>
        <input type="text" placeholder="Agregar texto" />
      </div>
      <div class="input-group">
        <label>Contraseña del gerente:</label>
        <input type="password" placeholder="Agregar texto" />
      </div>
      <div class="button-group">
        <a href="gestion_cajeros.html" class="btn-red">Cancelar</a>
        <button class="btn-green" id="btnEnviarBaja">Enviar</button>
      </div>
    </section>
  </main>

  <script>
    document.getElementById("btnEnviarBaja").addEventListener("click", () => {
      Swal.fire({
        title: 'Cajero dado de baja 😺',
        icon: 'success',
        confirmButtonColor: '#6a1b9a'
      });
    });
  </script>
</body>
</html>
