<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reporte inventario</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="reporte.css" />
  <script defer src="../js/script.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <!-- Drawer -->
  <div class="drawer" id="drawer">
    <img src="../assets/logoBlanco.png" alt="Logo Arygatos" class="logo" />
    <div class="menu-option"><i class="fas fa-box-open"></i><span>Alta de producto</span></div>
    <div class="menu-option"><i class="fas fa-edit"></i><span>Modificación de producto</span></div>
    <div class="menu-option"><i class="fas fa-users-cog"></i><span>Gestión de cajeros</span></div>
    <div class="menu-option"><i class="fas fa-user-slash"></i><span>Baneo de clientes</span></div>
    <div class="menu-option"><i class="fas fa-cogs"></i><span>Variables del sistema</span></div>
    <div class="menu-option"><i class="fas fa-chart-line"></i><span>Acceso de reportes</span></div>
    <button class="logout-button">Cerrar sesión</button>
  </div>

  <!-- Contenido -->
  <div class="main-content reporte-container">
    <header class="reporte-header">
      <button class="menu-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
      <h1>Reporte inventario</h1>
      <img src="../assets/logo.png" alt="Logo Arygatos" class="logo-header" />
    </header>

    <section class="reporte-card">
      <h2>Seleccionar Tipo de reporte:</h2>
      <select id="tipoReporte" required>
        <option value="costo">Por costo</option>
        <option value="stock">Por stock</option>
        <option value="categoría">Por categoría</option>
      </select>

      <div class="reporte-buttons">
        <a href="index.html" class="btn-red">Cancelar</a>
        <button id="enviarReporte" class="btn-green">Enviar</button>
      </div>
    </section>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const enviar = document.getElementById("enviarReporte");

      enviar?.addEventListener("click", () => {
        const tipo = document.getElementById("tipoReporte").value;
        // En un futuro se puede pasar por query string o manejar con JS
        window.location.href = "reporte_detalle.html";
      });
    });
  </script>
</body>
</html>
