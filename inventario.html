<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventario</title>
  <link rel="stylesheet" href="inventario.css" />
  <script defer src="script.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <!-- Overlay (para modales si se usan) -->
  <div class="overlay" id="overlay"></div>

  <!-- Drawer -->
  <div class="drawer" id="drawer">
    <img src="logoBlanco.png" alt="Logo Arygatos" class="logo"/>
    <div class="menu-option"><i class="fas fa-dollar-sign"></i><span>Cobro</span></div>
    <div class="menu-option"><i class="fas fa-clipboard-list"></i><span>Inventario</span></div>
    <div class="menu-option"><i class="fas fa-credit-card"></i><span>Cierre de caja</span></div>
    <div class="menu-option"><i class="fas fa-comments-dollar"></i><span>Reembolso</span></div>
    <button class="logout-button">Cerrar sesión</button>
  </div>

  <div class="inventario-container">
    <header class="inventario-header">
      <button class="menu-btn" id="menuToggle">☰</button>
      <h1>Inventario</h1>
      <img src="logo.png" alt="Logo Arygatos" class="logo-header">
    </header>

    <main class="inventario-content">
      <!-- Formulario de búsqueda -->
      <section class="buscador">
        <h2>Código de barras:</h2>
        <input type="text" placeholder="Agregar texto" />
        <div class="form-buttons">
          <a href="./index.html"><button class="btn-red">Regresar</button></a>
          <button class="btn-green">Enviar</button>
        </div>
      </section>

      <!-- Resultado -->
      <section class="resultado">
        <table>
          <tr><th>Código de barras:</th><td>--</td></tr>
          <tr><th>Nombre:</th><td>--</td></tr>
          <tr><th>Marca:</th><td>--</td></tr>
          <tr><th>Precio:</th><td>--</td></tr>
          <tr><th>Stock disponible:</th><td>--</td></tr>
        </table>
      </section>
    </main>
  </div>
</body>
</html>
