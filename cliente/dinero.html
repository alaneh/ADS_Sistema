<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dinero prestado</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="dinero.css" />
  <script defer src="./script.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Drawer -->
  <div class="drawer" id="drawer">
    <img src="../assets/logoBlanco.png" alt="Logo Arygatos" class="logo" />
    <div class="menu-option"><i class="fas fa-hand-holding-usd"></i><span>Dinero prestado disponible</span></div>
    <div class="menu-option"><i class="fas fa-key"></i><span>Cambiar contraseña</span></div>
    <div class="menu-option"><i class="fas fa-undo"></i><span>Devolver producto</span></div>
    <button class="logout-button">Cerrar sesión</button>
  </div>

  <!-- Contenido principal -->
  <div class="main-content dinero-container">
    <header class="dinero-header">
      <button class="menu-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
      <h1>Dinero prestado</h1>
      <img src="../assets/logo.png" alt="Logo Arygatos" class="logo-header" />
    </header>

    <section class="dinero-card">
      <h2>Hemos calculado tu monto disponible:</h2>
      <div class="dinero-icono">
        <i class="fas fa-hand-holding-usd"></i>
        <h3>$ ---</h3>
      </div>
    </section>

    <div class="dinero-boton">
      <a href="./index.html"><button class="btn-red">Regresar</button></a>
    </div>
  </div>
</body>
</html>
