<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Devolver producto</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="devolver.css" />
  <script defer src="./script.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <!-- Drawer -->
  <div class="drawer" id="drawer">
    <img src="../assets/logoBlanco.png" alt="Logo Arygatos" class="logo" />
    <div class="menu-option"><i class="fas fa-hand-holding-usd"></i><span>Dinero prestado disponible</span></div>
    <div class="menu-option"><i class="fas fa-key"></i><span>Cambiar contraseña</span></div>
    <div class="menu-option"><i class="fas fa-undo"></i><span>Devolver producto</span></div>
    <button class="logout-button">Cerrar sesión</button>
  </div>

  <div class="main-content devolver-container">
    <header class="devolver-header">
      <button class="menu-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
      <h1>Devolver producto</h1>
      <img src="../assets/logo.png" alt="Logo Arygatos" class="logo-header" />
    </header>

    <section class="devolver-card">
      <label for="ticket">Seleccione la compra:</label>
      <select id="ticket" name="ticket">
        <option value=""># de ticket</option>
        <option value="1">Ticket #12345</option>
        <option value="2">Ticket #12346</option>
        <option value="3">Ticket #12347</option>
      </select>

      <div class="form-buttons">
        <a href="index.html" class="btn-red">Cancelar</a>
        <a href="./devolver_producto.html"><button class="btn-green">Siguiente</button></a>
      </div>
    </section>
  </div>
</body>
</html>
