<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Devolver producto</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="devolver_producto.css" />
  <script defer src="./script.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <!-- Drawer -->
  <div class="drawer" id="drawer">
    <img src="../assets/logoBlanco.png" alt="Logo Arygatos" class="logo" />
    <div class="menu-option"><i class="fas fa-hand-holding-usd"></i><span>Dinero prestado disponible</span></div>
    <div class="menu-option"><i class="fas fa-key"></i><span>Cambiar contraseña</span></div>
    <div class="menu-option"><i class="fas fa-undo"></i><span>Devolver producto</span></div>
    <button class="logout-button">Cerrar sesión</button>
  </div>

  <div class="main-content devolver-container">
    <header class="devolver-header">
      <button class="menu-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
      <h1>Devolver producto</h1>
      <img src="../assets/logo.png" alt="Logo Arygatos" class="logo-header" />
    </header>

    <section class="devolver-card">
      <h2>¿Qué producto va a devolver?</h2>
      <div class="tabla-wrapper">
        <table class="productos">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Cantidad</th>
              <th>Seleccionar</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Arena para gatos</td>
              <td>--</td>
              <td>2</td>
              <td><input type="checkbox" /></td>
            </tr>
            <tr>
              <td>Rascador mediano</td>
              <td>--</td>
              <td>1</td>
              <td><input type="checkbox" /></td>
            </tr>
            <tr>
              <td>Lata de comida premium</td>
              <td>--</td>
              <td>3</td>
              <td><input type="checkbox" /></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="form-buttons">
        <a href="./metodo_reembolso.html"><button class="btn-green">Enviar</button></a>
      </div>
    </section>
  </div>
</body>
</html>
