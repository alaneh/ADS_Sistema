<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Arygatos</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Menú lateral -->
    <aside class="sidebar">
      <img src="logo.png" alt="Arygatos Logo" class="logo">
      <nav class="menu">
        <a href="#"><i>💲</i><span>Cobro</span></a>
        <a href="#"><i>📋</i><span>Inventario</span></a>
        <a href="#"><i>💳</i><span>Cierre de caja</span></a>
        <a href="#"><i>💬💲</i><span>Reembolso</span></a>
      </nav>
      <button class="logout-button">Cerrar sesión</button>
    </aside>

    <!-- Panel principal -->
    <main class="main-content">
      <header class="top-bar">
        <button class="menu-toggle">☰</button>
        <h1>Bienvenido - Caja #</h1>
        <img src="logo.png" alt="Arygatos Logo" class="top-logo">
      </header>

      <section class="options-grid">
        <div class="option-card">
          <i>💲</i>
          <span>Cobro</span>
        </div>
        <div class="option-card">
          <i>📋</i>
          <span>Inventario</span>
        </div>
        <div class="option-card">
          <i>💳</i>
          <span>Cierre de caja</span>
        </div>
        <div class="option-card">
          <i>💬💲</i>
          <span>Reembolso</span>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
